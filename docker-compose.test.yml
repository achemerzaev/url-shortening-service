services:
  # --- база данных ---
  test-postgres:
    image: postgres:15-alpine
    container_name: test-postgres
    restart: always
    env_file: ./.env.test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- миграции ---
  migrate:
    image: migrate/migrate
    command: [
      "-path", "/migrations",
      "-database", "postgres://test_user:test_pass@test-postgres:5432/test_db?sslmode=disable",
      "up"
    ]
    volumes:
      - ./migrations:/migrations
    depends_on:
      test-postgres:
        condition: service_healthy
    restart: on-failure

  # --- кеш ---
  test-cache:
    image: redis:7-alpine
    container_name: test-redis
    env_file: ./.env.test
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
