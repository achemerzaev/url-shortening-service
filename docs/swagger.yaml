        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change long URL
      tags:
      - urls
  /shorten/{shortcode}/stats:
    get:
      description: Get statistics for short URL
      parameters:
