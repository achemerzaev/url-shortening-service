        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.ErrorResponse'
      summary: Register user
      tags:
      - users
  /shorten:
    post:
      consumes:
      - application/json
      description: Creates short link for provided long link
      parameters:
      - description: payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.HandlerPostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.HandlerPostResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create short URL
      tags:
      - urls
  /shorten/{shortcode}:
    delete:
      description: Deletes short url
      parameters:
      - description: short code
        in: path
        name: shortcode
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete short url
      tags:
      - urls
    get:
      description: Retrieves short link for provided long link
      parameters:
      - description: short code
        in: path
        name: shortcode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.HandlerGetResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get short URL
      tags:
      - urls
    put:
      description: Changes long link for provided short link
      parameters:
      - description: payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.HandlerPutRequest'
      - description: short code
        in: path
        name: shortcode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.HandlerPutResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.ErrorResponse'
        "404":
          description: Not Found
