info:
  contact: {}
  description: URL shortener service
  title: URL shortener API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: User login with email and password
      parameters:
      - description: payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.HandlerLoginRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.HandlerLoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.ErrorResponse'
      summary: Login user
      tags:
      - users
  /refresh:
    post:
      consumes:
      - application/json
      description: Creates new refresh token for a user
      parameters:
      - description: payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.HandlerRefreshRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.HandlerRefreshResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.ErrorResponse'
      summary: Update Refresh token
      tags:
      - users
  /register:
    post:
      consumes:
      - application/json
      description: Registers user and returns jwt tokens
      parameters:
      - description: payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.HandlerRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_achemerzaev_url-shortening-service_internal_dto.HandlerRegisterResponse'
        "409":
          description: Conflict
          schema:
